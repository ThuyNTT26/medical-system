<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Quản lý bệnh nhân</title>
    <link rel="stylesheet" href="../static/style.css" />
    <script src="patient.js" defer></script>
    <script src="../auth/auth.js" defer></script>
  </head>
  <body>
    <div class="container">
      <h2>Danh sách bệnh nhân</h2>

      <!-- Ô tìm kiếm -->
      <div class="search-group">
        <input type="text" id="searchMa" placeholder="Tìm mã bệnh nhân" />
        <input type="text" id="searchTen" placeholder="Tìm họ tên" />
        <input type="text" id="searchSDT" placeholder="Tìm số điện thoại" />
        <input type="text" id="searchCCCD" placeholder="Tìm CCCD" />
        <button onclick="searchPatients()">Tìm kiếm</button>
        <button onclick="loadPatients()">Làm mới</button>
      </div>

      <table id="patient-table">
        <thead>
          <tr>
            <th>Mã</th>
            <th>Họ tên</th>
            <th>Ngày sinh</th>
            <th>Giới tính</th>
            <th>SĐT</th>
            <th>Email</th>
            <th>Địa chỉ</th>
            <th>CCCD</th>
            <th>Tiền sử bệnh lý</th>
            <th>Hành động</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <div id="hoso-container" style="display: none; margin-top: 20px">
        <h3>Hồ sơ bệnh nhân</h3>
        <div id="hoso-content"></div>
      </div>

      <h3>Thêm / Cập nhật bệnh nhân</h3>
      <form id="patient-form">
        <input type="hidden" id="id" />
        <input type="text" id="hoTen" placeholder="Họ tên" required />
        <input type="date" id="ngaySinh" />
        <input type="text" id="gioiTinh" placeholder="Giới tính" />
        <input type="text" id="soDienThoai" placeholder="SĐT" />
        <input type="email" id="email" placeholder="Email" />
        <input type="text" id="diaChi" placeholder="Địa chỉ" />
        <input type="text" id="cccd" placeholder="CCCD" />
        <input type="text" id="tienSuBenhLy" placeholder="Tiền sử bệnh" />
        <button type="submit">Lưu</button>
      </form>
    </div>
  </body>
</html>
