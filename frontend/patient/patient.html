<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Quản lý bệnh nhân</title>
    <link rel="stylesheet" href="../patient/patient.css" />
  </head>
  <body>
    <div class="container">
      <h1>Quản lý bệnh nhân</h1>

      <!-- Bảng danh sách bệnh nhân -->
      <table id="patientTable">
        <thead>
          <tr>
            <th>Mã BN</th>
            <th>Họ tên</th>
            <th>Ngày sinh</th>
            <th>Địa chỉ</th>
            <th>Điện thoại</th>
            <th>Hành động</th>
          </tr>
        </thead>
        <tbody>
          <!-- Dữ liệu bệnh nhân sẽ được JS đổ vào đây -->
          <tr>
            <td>BN001</td>
            <td>Nguyễn Văn A</td>
            <td>01/01/2000</td>
            <td>Hà Nội</td>
            <td>0123456789</td>
            <td>
              <button class="edit-btn">Sửa</button>
              <button class="delete-btn">Xóa</button>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Form thêm/sửa bệnh nhân -->
      <h2>Thêm / Sửa thông tin bệnh nhân</h2>
      <form id="patientForm">
        <label>Mã BN:</label>
        <input type="text" id="patientId" placeholder="Nhập mã BN" required />

        <label>Họ tên:</label>
        <input type="text" id="fullName" placeholder="Nhập họ tên" required />

        <label>Ngày sinh:</label>
        <input type="date" id="dob" required />

        <label>Địa chỉ:</label>
        <input type="text" id="address" placeholder="Nhập địa chỉ" required />

        <label>Điện thoại:</label>
        <input
          type="tel"
          id="phone"
          placeholder="Nhập số điện thoại"
          required
        />

        <button type="submit">Lưu</button>
      </form>
    </div>
  </body>
</html>
