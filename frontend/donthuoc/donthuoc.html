<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đơn thuốc</title>
    <link rel="stylesheet" href="../static/style.css" />
  <link rel="stylesheet" href="./donthuoc.css" />
    <script src="../auth/auth.js" defer></script>
</head>
<body>
    <div id="header-container"></div>
  <div class="all">
    <div class="head">
      <h1>ĐƠN THUỐC</h1>
    </div>

    <div class="thanhtimkiem">
      <input type="text" id="searchDonThuoc" placeholder="Tìm mã đơn hoặc mã kết quả" />
      <div>
        <button onclick="timKiemDonThuoc()">Tìm kiếm</button>
        <button onclick="taiDanhSachDonThuoc()">Hiển thị tất</button>
      </div>
    </div>

    <div style="margin: 20px 0;">
      <button onclick="hienDongMoiDonThuoc()">Thêm đơn thuốc</button>
    </div>

    <div>
      <table id="bangDonThuoc">
        <thead>
          <tr>
            <th>ID đơn thuốc</th>
            <th>ID kết quả</th>
            <th>Ngày kê đơn</th>
            <th>Ghi chú</th>
            <th>Chức năng</th>
          </tr>
        </thead>
        <tbody id="donthuoc-body"></tbody>
      </table>
    </div>
  </div>

  <script src="donthuoc.js"></script>
</body>
  <script type="module">
    import { loadHeader, checkAuth } from "/frontend/layouts/header.js";

    window.addEventListener("DOMContentLoaded", async () => {
      checkAuth();
      await loadHeader();
    });
  </script>
</html>
