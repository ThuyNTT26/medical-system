<!-- frontend/exam/phieu.html -->
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Phiếu Khám</title>
</head>
<body>
  <h2>Tạo phiếu khám</h2>
  <input id="patient_id" placeholder="Mã bệnh nhân" /><br />
  <input id="symptom" placeholder="Triệu chứng" /><br />
  <input id="diagnosis" placeholder="Chuẩn đoán" /><br />
  <button onclick="sendPhieu()">Gửi</button>

  <script>
    async function sendPhieu() {
      const data = {
        patient_id: parseInt(document.getElementById("patient_id").value),
        symptom: document.getElementById("symptom").value,
        diagnosis: document.getElementById("diagnosis").value,
      };

      const response = await fetch("http://127.0.0.1:8000/api/v1/exam/phieu", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });

      const result = await response.json();
      alert(result.message);
    }
  </script>
</body>
</html>
